<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-labelledby="title desc">
  <title id="title">Listings near the market price</title>
  <desc id="desc">Fresh listings priced within ten percent of the cheapest listing earn up to fifteen points. Five hundred listings receive the full score.</desc>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d6ef3"/>
      <stop offset="100%" stop-color="#22b8f0"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d6ef3" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1d6ef3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <line x1="52" y1="20" x2="52" y2="148" stroke="#94a3b8" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="52" y1="148" x2="464" y2="148" stroke="#94a3b8" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="52" y1="84" x2="464" y2="84" stroke="#94a3b8" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="46" y="24" fill="#94a3b8" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="end">15 pts</text>
  <text x="46" y="152" fill="#94a3b8" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="end">0</text>
  <text x="60" y="17" fill="#cbd5e1" font-size="10" font-family="ui-sans-serif, system-ui, sans-serif">fresh listings within 10% of the cheapest</text>

  <path d="M 52,148 L 52.8,133.7 L 56.1,111.1 L 60.2,98.6 L 68.5,85.3 L 93.2,67.0 L 134.4,53.0 L 216.8,38.8 L 299.2,30.5 L 381.6,24.6 L 464,20 L 464,148 Z" fill="url(#fill)"/>

  <polyline points="52,148 52.8,133.7 56.1,111.1 60.2,98.6 68.5,85.3 93.2,67.0 134.4,53.0 216.8,38.8 299.2,30.5 381.6,24.6 464,20" fill="none" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="52" cy="148" r="5" fill="#1d6ef3" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2"/>
  <circle cx="68.5" cy="85.3" r="5" fill="#1d6ef3" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2"/>
  <circle cx="464" cy="20" r="5" fill="#22b8f0" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2"/>

  <text x="52" y="172" fill="#94a3b8" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="start">0 listings</text>
  <text x="76" y="85" fill="#cbd5e1" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">20</text>
  <text x="464" y="172" fill="#94a3b8" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="end">500 listings</text>
</svg>
