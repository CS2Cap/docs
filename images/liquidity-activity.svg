<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-labelledby="title desc">
  <title id="title">Completed sales</title>
  <desc id="desc">Recent completed sales earn up to forty-five points. A combined rate of one hundred sales per day receives the full score.</desc>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d6ef3"/>
      <stop offset="100%" stop-color="#22b8f0"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d6ef3" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1d6ef3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <line x1="52" y1="20" x2="52" y2="148" stroke="#94a3b8" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="52" y1="148" x2="464" y2="148" stroke="#94a3b8" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="52" y1="84" x2="464" y2="84" stroke="#94a3b8" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="46" y="24" fill="#94a3b8" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="end">45 pts</text>
  <text x="46" y="152" fill="#94a3b8" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="end">0</text>
  <text x="60" y="17" fill="#cbd5e1" font-size="10" font-family="ui-sans-serif, system-ui, sans-serif">recent sales balanced across 1, 7, and 30 days</text>

  <path d="M 52,148 L 54.1,136.8 L 56.1,128.8 L 60.2,117.5 L 68.5,103.4 L 80.8,90.3 L 93.2,81.5 L 134.4,63.6 L 196.2,48.6 L 258,39.0 L 361,27.9 L 464,20 L 464,148 Z" fill="url(#fill)"/>

  <polyline points="52,148 54.1,136.8 56.1,128.8 60.2,117.5 68.5,103.4 80.8,90.3 93.2,81.5 134.4,63.6 196.2,48.6 258,39.0 361,27.9 464,20" fill="none" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="52" cy="148" r="5" fill="#1d6ef3" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2"/>
  <circle cx="93.2" cy="81.5" r="5" fill="#1d6ef3" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2"/>
  <circle cx="464" cy="20" r="5" fill="#22b8f0" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2"/>

  <text x="52" y="172" fill="#94a3b8" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="start">0 sales/day</text>
  <text x="101" y="80" fill="#cbd5e1" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">10/day</text>
  <text x="464" y="172" fill="#94a3b8" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="end">100 sales/day</text>
</svg>
